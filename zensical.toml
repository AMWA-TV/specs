[project]
site_name = "AMWA Specifications"
site_description = "The canonical home for AMWA specifications, NMOS specifications, and AMWA Increments."
site_url = "https://specs.amwa.tv/"
repo_name = "AMWA-TV/specs"
repo_url = "https://github.com/AMWA-TV/specs"
edit_uri = "edit/main/"
docs_dir = "docs"
site_dir = "site"
nav = [
    { Home = "index.md" },
    { "About AMWA Specifications" = "1.0. About AMWA Specifications.md" },
]
extra_css = ["stylesheets/amwa-branding.css"]
extra_javascript = ["javascripts/amwa-branding.js"]

[project.theme]
features = [
    "navigation.top",
    "navigation.sections",
    "search.suggest",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = false
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
